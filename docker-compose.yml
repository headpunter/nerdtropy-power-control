version: "3.8"

services:
  api:
    build: ./api
    container_name: power-api
    ports:
      - "8000:8000"
    volumes:
      - api_data:/data
    environment:
      LOKI_URL: "http://loki:3100"
      INFLUXDB_URL: "http://influxdb:8086"
      INFLUXDB_TOKEN: "nerdtropy-admin-token"
      INFLUXDB_ORG: "nerdtropy"
      INFLUXDB_BUCKET: "power"
      DB_PATH: "/data/power.db"
    depends_on:
      - loki
      - influxdb
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    container_name: power-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: power-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: nerdtropy-admin-pass
      DOCKER_INFLUXDB_INIT_ORG: nerdtropy
      DOCKER_INFLUXDB_INIT_BUCKET: power
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: nerdtropy-admin-token
    restart: unless-stopped

  # Grafana is running standalone on port 30037 — not managed here.
  # Connect it to loki (http://<host>:3100) and influxdb (http://<host>:8086)
  # using the provisioning files in grafana/provisioning/

volumes:
  api_data:
  loki_data:
  influxdb_data:
